[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-agentic-mcp"
version = "1.0.0"
description = "S.A.G.E. - Secure Agentic Git Engine: local agentic MCP orchestration that analyzes, patches, verifies and PRs a GitHub repo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.10,<2", "pydantic>=2.7,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sage = "sage.cli:main"

[tool.setuptools]
packages = ["sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
